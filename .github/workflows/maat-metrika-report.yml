name: Отчёт сайта MAAT
# 09:00 Москвы = 06:00 UTC. Скрипт публикует отчёт только на новое закрытое окно из двух дней.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Проверить расчёт на тестовых данных
        run: python3 -m unittest tests/test_metrika_report.py
      - name: Собрать отчёт, если задан секрет
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: python3 scripts/metrika_report.py
      - name: Сохранить историю без секретов
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-analytics/published.json
          if [ -d site-analytics/history ]; then git add site-analytics/history; fi
          if [ -f site-analytics/goal-registry.json ]; then git add site-analytics/goal-registry.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Обновить сводку посещений сайта"
          git pull --rebase origin main
          git push origin HEAD:main
