name: Ozon ООО — годовые отчёты
# Publication gated by commit message or workflow_dispatch input
on:
  workflow_dispatch:
    inputs:
      publish_public_aggregates:
        description: Публиковать сводные продажи, остатки и суммы выплат на ОБЩЕДОСТУПНОМ сайте
        type: boolean
        default: false
        required: true
  push:
    branches: [main]
    paths:
      - .github/workflows/ozon-ooo-sync.yml
      - scripts/ozon_sync.py
      - tests/test_ozon_sync.py
permissions:
  contents: write
env:
  OZON_RUN_PUBLICATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_public_aggregates == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish authorized Ozon KLM annual aggregates')) }}
concurrency:
  group: ozon-ooo-annual-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Проверить расчёты
        run: python -m unittest discover -s tests -p 'test_ozon_*.py'
      - name: Проверить источники без сохранения и вывода сумм
        if: env.OZON_RUN_PUBLICATION != 'true'
        env:
          OZON_OOO_CLIENT_ID: ${{ secrets.OZON_OOO_CLIENT_ID }}
          OZON_OOO_API_KEY: ${{ secrets.OZON_OOO_API_KEY }}
        run: python scripts/ozon_sync.py
      - name: Сформировать только разрешённые сводные данные
        if: env.OZON_RUN_PUBLICATION == 'true'
        env:
          OZON_OOO_CLIENT_ID: ${{ secrets.OZON_OOO_CLIENT_ID }}
          OZON_OOO_API_KEY: ${{ secrets.OZON_OOO_API_KEY }}
          OZON_PUBLICATION_APPROVED: confirmed
        run: python scripts/ozon_sync.py --publish
      - name: Опубликовать сводные показатели без документов и реквизитов
        if: env.OZON_RUN_PUBLICATION == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ozon-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update approved Ozon KLM accounting aggregates'
          git pull --rebase origin main
          git push origin HEAD:main
