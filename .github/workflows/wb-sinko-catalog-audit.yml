name: WB SINKO — catalog matching audit
on:
  push:
    paths: ['.github/workflows/wb-sinko-catalog-audit.yml']
permissions: {}
jobs:
  audit:
    if: github.event.head_commit.message == 'Check SINKO catalog matching counts without price requests'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List authorized product names, volumes and categories only
        env:
          WB_IP_API_TOKEN: ${{ secrets.WB_IP_API_TOKEN }}
          WB_OOO_API_TOKEN: ${{ secrets.WB_OOO_API_TOKEN }}
        shell: python
        run: |
          import os,json,base64
          token=os.environ["WB_IP_API_TOKEN"].strip()
          parts=token.split(".")
          if len(parts)!=3: raise RuntimeError("Token format cannot be diagnosed")
          claims=json.loads(base64.urlsafe_b64decode(parts[1]+"="*(-len(parts[1])%4)))
          scope=int(claims.get("s",0))
          print("IP_PRICES_CATEGORY",bool(scope & (1<<3)))
          print("IP_READ_ONLY",bool(scope & (1<<30)))
          print("No tokens, token IDs, seller IDs or token claims are exported.")
