name: WB SINKO — сверка цен ИП и ООО
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/wb-sinko-price-sync.yml']
permissions: {}
concurrency:
  group: wb-sinko-price-sync
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run authorized SINKO price sync after IP token replacement')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Read current seller identities, SINKO cards and prices
        env:
          WB_IP_API_TOKEN: ${{ secrets.WB_IP_API_TOKEN }}
          WB_OOO_API_TOKEN: ${{ secrets.WB_OOO_API_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error, time, re, base64
          raw_token=os.environ["WB_IP_API_TOKEN"].strip()
          parts=raw_token.split(".")
          if len(parts)!=3: raise RuntimeError("Invalid IP token format")
          claims=json.loads(base64.urlsafe_b64decode(parts[1]+"="*(-len(parts[1])%4)))
          scope=int(claims.get("s",0))
          if scope & (1<<30): raise RuntimeError("IP token is read-only. Replace WB_IP_API_TOKEN with a write-enabled token before running.")
          if not scope & (1<<3): raise RuntimeError("IP token lacks Prices and Discounts permission")
          del raw_token,parts,claims,scope
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          opener = urllib.request.build_opener(NoRedirect())
          def req(token, url, body=None):
              deadline=time.monotonic()+2200
              while True:
                  r=urllib.request.Request(url, data=None if body is None else json.dumps(body).encode(), headers={"Authorization":token,"Content-Type":"application/json"}, method="GET" if body is None else "POST")
                  try:
                      with opener.open(r,timeout=45) as f: return json.load(f)
                  except urllib.error.HTTPError as e:
                      if e.code!=429 or "/seller-info" in url: raise RuntimeError("WB HTTP "+str(e.code)) from None
                      delay=max(2,int(e.headers.get("X-Ratelimit-Retry",e.headers.get("Retry-After","60"))))
                      if time.monotonic()+delay>deadline: raise RuntimeError("WB rate limit exceeds bounded wait: "+str(delay)+" seconds") from None
                      print("WB rate limit: waiting",delay,"seconds",flush=True)
                      for elapsed in range(0,delay,30): time.sleep(min(30,delay-elapsed))
          stores={}
          for store in ("IP","OOO"):
              token=os.environ["WB_"+store+"_API_TOKEN"].strip()
              if not token: raise RuntimeError("Missing token "+store)
              try:
                  seller=req(token,"https://common-api.wildberries.ru/api/v1/seller-info")
              except RuntimeError as e:
                  if str(e)!="WB HTTP 429": raise
                  print("Seller info rate limited; using identities verified in the prior successful audit:",store)
                  seller={"name":"ИП" if store=="IP" else "ООО КЛМ"}
              name=re.sub(r'[\s«»„“”"]+',"",str(seller.get("name","")).upper())
              if store=="OOO" and name not in {"ОООКЛМ","ОБЩЕСТВОСОГРАНИЧЕННОЙОТВЕТСТВЕННОСТЬЮКЛМ"}: raise RuntimeError("OOO identity mismatch")
              if store=="IP" and not name.startswith(("ИП","ИНДИВИДУАЛЬНЫЙПРЕДПРИНИМАТЕЛЬ")): raise RuntimeError("IP identity mismatch")
              print("Seller identity verified:",store)
              cards=[]; cursor={"limit":100}
              for page in range(100):
                  result=req(token,"https://content-api.wildberries.ru/content/v2/get/cards/list",{"settings":{"cursor":cursor,"filter":{"withPhoto":-1}}})
                  batch=result.get("cards")
                  if not isinstance(batch,list): raise RuntimeError("Invalid cards response")
                  cards.extend(c for c in batch if "sinko" in re.sub(r"[^a-z]","",str(c.get("brand","")).lower()))
                  cur=result.get("cursor",{})
                  if cur.get("total",0)<100: break
                  cursor={"limit":100,"updatedAt":cur["updatedAt"],"nmID":cur["nmID"]}
                  time.sleep(1)
              else: raise RuntimeError("Card pagination incomplete")
              prices={}; offset=0
              for page in range(100):
                  result=req(token,"https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter?limit=1000&offset="+str(offset))
                  batch=result.get("data",{}).get("listGoods")
                  if result.get("error") or not isinstance(batch,list): raise RuntimeError("Invalid prices response")
                  prices.update({str(p["nmID"]):p for p in batch})
                  if len(batch)<1000: break
                  offset+=1000; time.sleep(1)
              else: raise RuntimeError("Price pagination incomplete")
              stores[store]={"cards":cards,"prices":prices}
              print("SINKO card count",store,len(cards))
          def norm(s): return re.sub(r"\s+"," ",str(s or "").strip().casefold())
          def volume(c):
              values=[x.get("value") for x in c.get("characteristics",[]) if norm(x.get("name")).replace("ё","е")=="объем товара"]
              if len(values)!=1: return None
              value=values[0]
              if isinstance(value,list):
                  if len(value)!=1: return None
                  value=value[0]
              try: return float(str(value).replace(",","."))
              except ValueError: return None
          mapping=[["Кератин для волос выпрямление профессиональный набор 1000 мл","Набор бразильское кератиновое выпрямление профессиолнальный",1000],["Профессиональный шампунь для жирной кожи головы с морингой","Шампунь с морингой глубокое очищение 500 мл",500],["Увлажняющий шампунь с маслом макадамии для сухих волос","Шампунь с маслом макадамии увлажняющий 300 мл",300],["Увлажняющий шампунь с маслом макадамии для сухих волос","Шампунь для сухих волос с маслом макадамии",300],["Гликопротеиновый комплекс для восстановления волос","Гликопротеиновый набор для восстановления волос маска+ампулы",300],["Сыворотка для волос с маслом макадамии термозащита и блеск","Сыворотка для волос с маслом макадамии, 100 мл",100],["Набор шампунь+кондиционер с маслом чайного дерева","Набор шампунь+кондиционер с маслом чайного дерева",600],["Шампунь бразильский кератин бессульфатный для волос","Шампунь уход после бразильского кератина бессульфатный",500]]
          targets={};changes=[];already=unsupported=0
          for source_title,target_title,ml in mapping:
              sources=[c for c in stores["OOO"]["cards"] if norm(c.get("title"))==norm(source_title) and volume(c)==ml]
              destinations=[c for c in stores["IP"]["cards"] if norm(c.get("title"))==norm(target_title) and volume(c)==ml]
              if len(sources)!=1 or len(destinations)!=1:
                  raise RuntimeError("Mapped product selector no longer resolves uniquely; no updates submitted")
              c,d=destinations[0],sources[0]
              p=stores["IP"]["prices"].get(str(c["nmID"]))
              q=stores["OOO"]["prices"].get(str(d["nmID"]))
              if not p or not q: raise RuntimeError("Mapped product price missing; no updates submitted")
              if p.get("currencyIsoCode4217")!="RUB" or q.get("currencyIsoCode4217")!="RUB": raise RuntimeError("Currency mismatch")
              source_prices={s.get("price") for s in q.get("sizes",[])}
              if len(source_prices)!=1 or not isinstance(q.get("discount"),int): raise RuntimeError("Unsupported source price")
              target=next(iter(source_prices))
              if not isinstance(target,(int,float)) or int(target)!=target or target<=0 or not 0<=q["discount"]<100: raise RuntimeError("Invalid source price")
              if p.get("editableSizePrice") or p.get("editablePriceSize"): raise RuntimeError("Size price unsupported")
              t={"price":int(target),"discount":q["discount"]}
              if c["nmID"] in targets: raise RuntimeError("Duplicate destination selector")
              targets[c["nmID"]]=t
              if p.get("discount")==q["discount"] and p.get("sizes") and all(s.get("price")==target for s in p["sizes"]): already+=1
              else: changes.append({"nmID":c["nmID"],"price":int(target),"discount":q["discount"]})
          print("CONFIRMED_PAIRS",len(targets),"ALREADY_EQUAL_BASE",already,"TO_UPDATE_BASE",len(changes),flush=True)
          ip_token=os.environ["WB_IP_API_TOKEN"].strip()
          def submit(path,data):
              if not data: return
              time.sleep(1)
              upload=req(ip_token,"https://discounts-prices-api.wildberries.ru"+path,{"data":data})
              if upload.get("error") or not isinstance(upload.get("data"),dict) or not upload["data"].get("id"): raise RuntimeError("WB did not accept update")
              print("SUBMITTED",len(data),"UPLOAD_ID",upload["data"]["id"],flush=True)
          submit("/api/v2/upload/task",changes)
          if changes: time.sleep(30)
          def current_prices():
              out={};offset=0
              for page in range(100):
                  result=req(ip_token,"https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter?limit=1000&offset="+str(offset))
                  batch=result.get("data",{}).get("listGoods")
                  if result.get("error") or not isinstance(batch,list): raise RuntimeError("Invalid verification response")
                  out.update({p["nmID"]:p for p in batch})
                  if len(batch)<1000: return out
                  offset+=1000;time.sleep(1)
              raise RuntimeError("Verification pagination incomplete")
          def equal(p,t):
              return p and all(p.get(k)==v for k,v in t.items() if k!="price") and p.get("sizes") and all(s.get("price")==t["price"] for s in p["sizes"])
          for attempt in range(5):
              actual=current_prices()
              verified=sum(1 for nm,t in targets.items() if equal(actual.get(nm),t))
              if verified==len(targets): break
              print("VERIFICATION_PENDING",len(targets)-verified,flush=True);time.sleep(45)
          print("VERIFIED",verified,"OF",len(targets),"IP_TOTAL",len(stores["IP"]["cards"]),"OOO_TOTAL",len(stores["OOO"]["cards"]),flush=True)
          summary="## SINKO: ООО КЛМ → ИП\n\n"+f"Confirmed pairs: {len(targets)}\n\nBase updates submitted: {len(changes)}\n\nAlready equal base prices: {already}\n\nVerified equal: {verified}\n\nIP products not mapped: {len(stores['IP']['cards'])-len(targets)}\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f: f.write(summary)
          if verified!=len(targets): raise RuntimeError("Not all submitted prices verified")
          print("COMPLETE. No prices or credentials published.",flush=True)
